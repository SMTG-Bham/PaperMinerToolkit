[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paperscraper"
version = "0.0.1"
description = "A package for extracting structured information from scientific papers with configurable language and vision models."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
dependencies = [
  "click",
  "openai",
  "pandas",
  "pymupdf",
  "pypdf",
  "requests",
  "sentencepiece",
  "tiktoken>=0.13.0",
  "tqdm",
  "transformers",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
]

[project.scripts]
ps_search = "cli.cli:paper_search"
ps_download = "cli.cli:download"
ps_import_pdfs = "cli.cli:import_pdf_folder"
ps_scrape = "cli.cli:scrape"
ps_store = "cli.cli:store"
ps_elsevier_key = "cli.cli:update_elsevier_api_key"
ps_core_key = "cli.cli:update_core_api_key"
ps_unpaywall_email = "cli.cli:update_unpaywall_api_email"
ps_openai_key = "cli.cli:update_openai_api_key"
ps_anthropic_key = "cli.cli:update_anthropic_api_key"
ps_model_config = "cli.cli:model_config"
ps_model_status = "cli.cli:model_status"
ps_reset = "cli.cli:reset_scraper"
ps_status = "cli.cli:scraper_status"
ps_sort = "cli.cli:sort_df"
ps_shuffle = "cli.cli:shuffle_papers"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: tests that call live external services and require credentials",
]
addopts = [
  "-m",
  "not network",
]

[tool.coverage.run]
source = ["paperscraper", "cli"]

[tool.coverage.report]
show_missing = true
skip_covered = true
