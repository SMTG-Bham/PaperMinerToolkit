[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperminer"
dynamic = ["version"]
description = "A package for extracting structured information from scientific papers with configurable language and vision models."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louie", email = "louies@hotmail.co.uk" }]
keywords = ["research", "scientific-papers", "materials", "text-mining", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Text Processing",
]
requires-python = ">=3.11"
dependencies = [
  "click",
  "headroom-ai[image,ml]>=0.35,<0.36",
  "openai",
  "numpy",
  "pandas",
  "pillow",
  "pymupdf",
  "pypdf",
  "requests",
  "regex",
  "scipy",
  "joblib",
  "matplotlib",
  "scikit-learn",
  "tiktoken>=0.13.0",
  "tqdm",
  "transformers",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "ruff",
]
docs = [
  "myst-nb>=1.2,<2",
  "pydata-sphinx-theme>=0.16,<0.21",
  "sphinx>=8,<10",
  "sphinx-click>=6,<7",
  "sphinxcontrib-mermaid>=1,<2",
]

[project.urls]
Homepage = "https://github.com/SMTG-Bham/PaperScraper"
Repository = "https://github.com/SMTG-Bham/PaperScraper"
Issues = "https://github.com/SMTG-Bham/PaperScraper/issues"

[project.scripts]
ps_search = "paperminer.cli:paper_search"
ps_download = "paperminer.cli:download"
ps_corpus_stats = "paperminer.cli:corpus_status"
ps_topics_train = "paperminer.cli:topics_train"
ps_topics_compare = "paperminer.cli:topics_compare"
ps_topics_show = "paperminer.cli:topics_show"
ps_topics_name = "paperminer.cli:topics_name"
ps_topics_predict = "paperminer.cli:topics_predict"
ps_topics_trends = "paperminer.cli:topics_trends"
ps_topics_store = "paperminer.cli:topics_store"
ps_topics_models = "paperminer.cli:topics_models"
ps_import_pdfs = "paperminer.cli:import_pdf_folder"
ps_import_author = "paperminer.cli:import_author"
ps_enrich = "paperminer.cli:enrich"
ps_scrape = "paperminer.cli:scrape"
ps_filter_regex = "paperminer.cli:filter_regex"
ps_filter_topic = "paperminer.cli:filter_topic"
ps_filter_status = "paperminer.cli:filter_status"
ps_filter_reset = "paperminer.cli:filter_reset"
ps_store = "paperminer.cli:store"
ps_elsevier_key = "paperminer.cli:update_elsevier_api_key"
ps_core_key = "paperminer.cli:update_core_api_key"
ps_unpaywall_email = "paperminer.cli:update_unpaywall_api_email"
ps_crossref_email = "paperminer.cli:update_crossref_api_email"
ps_openalex_key = "paperminer.cli:update_openalex_api_key"
ps_ncbi_key = "paperminer.cli:update_ncbi_api_key"
ps_ncbi_email = "paperminer.cli:update_ncbi_api_email"
ps_openai_key = "paperminer.cli:update_openai_api_key"
ps_anthropic_key = "paperminer.cli:update_anthropic_api_key"
ps_model_config = "paperminer.cli:model_config"
ps_model_status = "paperminer.cli:model_status"
ps_reset = "paperminer.cli:reset_scraper"
ps_status = "paperminer.cli:scraper_status"

[tool.setuptools.dynamic]
version = { attr = "paperminer._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["paperminer*"]

[tool.setuptools.package-data]
"paperminer" = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: tests that call live external services and require credentials",
  "slow: tests that run slower local integrations such as real compression backends",
]
addopts = [
  "-m",
  "not network and not slow",
]

[tool.ruff.lint]
select = ["D", "F"]
extend-select = ["ANN", "D212"]
# Dynamic provider payloads and test doubles legitimately require Any.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.run]
source = ["paperminer"]

[tool.coverage.report]
show_missing = true
skip_covered = true
