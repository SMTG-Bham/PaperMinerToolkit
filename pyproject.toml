[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperminer"
dynamic = ["version"]
description = "A package for extracting structured information from scientific papers with configurable language and vision models."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louie", email = "louies@hotmail.co.uk" }]
keywords = ["research", "scientific-papers", "materials", "text-mining", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Text Processing",
]
requires-python = ">=3.11"
dependencies = [
  "click",
  "headroom-ai[image,ml]>=0.35,<0.36",
  "openai",
  "numpy",
  "pandas",
  "pillow",
  "pymupdf",
  "pypdf",
  "requests",
  "regex",
  "scipy",
  "joblib",
  "matplotlib",
  "scikit-learn",
  "tiktoken>=0.13.0",
  "tqdm",
  "transformers",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "ruff",
]
docs = [
  "myst-nb>=1.2,<2",
  "pydata-sphinx-theme>=0.16,<0.21",
  "sphinx>=8,<10",
  "sphinx-click>=6,<7",
  "sphinxcontrib-mermaid>=1,<2",
]

[project.urls]
Homepage = "https://github.com/SMTG-Bham/PaperMiner"
Repository = "https://github.com/SMTG-Bham/PaperMiner"
Issues = "https://github.com/SMTG-Bham/PaperMiner/issues"

[project.scripts]
pm = "paperminer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "paperminer._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["paperminer*"]

[tool.setuptools.package-data]
"paperminer" = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: tests that call live external services and require credentials",
  "slow: tests that run slower local integrations such as real compression backends",
]
addopts = [
  "-m",
  "not network and not slow",
]

[tool.ruff.lint]
select = ["D", "F"]
extend-select = ["ANN", "D212"]
# Dynamic provider payloads and test doubles legitimately require Any.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.run]
source = ["paperminer"]

[tool.coverage.report]
show_missing = true
skip_covered = true
