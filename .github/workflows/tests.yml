name: Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Ends of the range declared by requires-python in pyproject.toml.
        # 3.14 is what build_tools/environment.yml provisions for development.
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run unit tests
        run: |
          pytest --cov=paperscraper --cov-report=term-missing --cov-report=xml

      - name: Validate docstrings and function annotations
        run: |
          ruff check paperscraper tests

      - name: Compile Python sources and examples
        run: |
          python -m compileall paperscraper examples

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
